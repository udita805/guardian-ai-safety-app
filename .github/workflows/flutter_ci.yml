name: Guardian AI - Flutter CI & Android Build

on:
  push:
    branches: [ main, master, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions UI

jobs:
  # =========================================================================
  # 1. CODE QUALITY, LINTING & AUTOMATED TESTS
  # =========================================================================
  analyze-and-test:
    name: Lint, Analyze & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Verify Flutter & Environment
        run: flutter doctor -v

      - name: Install Pub Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Code Analysis (Flutter Analyze)
        run: flutter analyze --fatal-infos

      - name: Run Unit & Hardware Mock Tests
        run: flutter test --coverage

  # =========================================================================
  # 2. BUILD ANDROID APK & APP BUNDLE (.AAB)
  # =========================================================================
  build-android:
    name: Build Android Release Artifacts
    needs: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # Optional: Decode Production Keystore if configured in GitHub Secrets
      - name: Configure Keystore (Optional)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      # 1. Build universal single APK (Easiest for hackathon judges & testers to sideload)
      - name: Build Universal Android APK
        run: flutter build apk --release

      # 2. Build ABI-split APKs (Reduced file size per CPU architecture)
      - name: Build Split-per-ABI APKs
        run: flutter build apk --release --split-per-abi

      # 3. Build Google Play Store App Bundle (.aab)
      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      # 4. Upload APKs so you can download them directly from the GitHub Actions UI
      - name: Upload Release APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: guardian-ai-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      # 5. Upload AAB for Google Play Console
      - name: Upload App Bundle (AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: guardian-ai-aab
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 14

  # =========================================================================
  # 3. AUTOMATED GITHUB RELEASE (Triggered when pushing a tag e.g. v1.0.0)
  # =========================================================================
  create-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Built APKs
        uses: actions/download-artifact@v4
        with:
          name: guardian-ai-apks
          path: apks

      - name: Create GitHub Release with APK Downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Guardian AI ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            apks/*.apk
