name: Guardian AI - Flutter CI & Android Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger button from the GitHub Actions tab

permissions:
  contents: write

jobs:
  # =========================================================================
  # JOB 1: CODE LINTING, ANALYSIS & TESTING
  # =========================================================================
  analyze-and-test:
    name: Lint & Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install Pub Dependencies
        run: flutter pub get

      - name: Run Static Code Analysis
        run: flutter analyze --no-fatal-infos

      # Only runs tests if test files exist (prevents failing empty/prototype repos)
      - name: Run Unit Tests (if present)
        run: |
          if [ -d "test" ] && [ -n "$(find test -name '*_test.dart' 2>/dev/null)" ]; then
            flutter test
          else
            echo "No test files detected in test/, skipping test phase."
          fi

  # =========================================================================
  # JOB 2: BUILD ANDROID APK & APP BUNDLE
  # =========================================================================
  build-android:
    name: Build Android APK
    needs: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Pub Dependencies
        run: flutter pub get

      # Build universal installable APK (sideloadable on any phone or emulator)
      - name: Build Android Release APK
        run: flutter build apk --release

      # Build Android App Bundle (.aab) for Google Play Console
      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      # Upload installable APK as a downloadable artifact in the GitHub UI
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: guardian-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 14

      # Upload AAB for Play Store upload
      - name: Upload App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: guardian-ai-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 14

  # =========================================================================
  # JOB 3: AUTOMATED GITHUB RELEASE (When pushing a tag e.g. v1.0.0)
  # =========================================================================
  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-android
    runs-on: ubuntu-latest

    steps:
      - name: Download Built APK
        uses: actions/download-artifact@v4
        with:
          name: guardian-ai-apk
          path: release-apk

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Guardian AI ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-apk/*.apk
